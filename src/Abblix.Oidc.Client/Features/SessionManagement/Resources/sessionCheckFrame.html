<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<iframe id="op" src="{{checkSessionIframe}}" hidden></iframe>
<script nonce="{{nonce}}">
    (function () {
        var opOrigin = "{{opOrigin}}";
        var selfOrigin = "{{selfOrigin}}";
        var message = "{{message}}";
        var intervalMs = {{intervalMs}};

        // OpenID Connect Session Management 1.0 section 3.2: the provider frame answers with one of these
        // three. Anything else is not an answer to the question this frame asked.
        var CHANGED = "changed";
        var UNCHANGED = "unchanged";
        var ERROR = "error";

        // What this frame tells the page that hosts it. Named rather than passed through, because section
        // 3.2 attaches a duty to one of the three: "Upon receipt of changed, the RP MUST perform
        // re-authentication with prompt=none", and upon error the RP "MUST NOT perform re-authentication
        // with prompt=none". A page listening for "recheck" cannot mistake the second for the first, which
        // it could if it were handed the provider's word and left to tell them apart.
        var RECHECK = "abblix-oidc-session:recheck";
        var OK = "abblix-oidc-session:ok";
        var FAILED = "abblix-oidc-session:error";

        var frame = document.getElementById("op");

        function ask() {
            frame.contentWindow.postMessage(message, opOrigin);
        }

        function tell(what) {
            // Addressed to this application's own origin rather than to "*", so the verdict is not readable
            // by whatever else may have framed this page.
            window.parent.postMessage(what, selfOrigin);
        }

        window.addEventListener("message", function (e) {
            // Section 6: "The RP iframe MUST enforce that it only processes messages from the origin of the
            // OP frame. It MUST reject postMessage requests from any other source origin to prevent
            // cross-site scripting attacks." Everything below this line trusts the sender, so this is the
            // line that decides who the sender may be.
            if (e.origin !== opOrigin)
                return;

            if (e.data === CHANGED)
                tell(RECHECK);
            else if (e.data === UNCHANGED)
                tell(OK);
            else if (e.data === ERROR)
                tell(FAILED);
        }, false);

        frame.addEventListener("load", function () {
            ask();
            setInterval(ask, intervalMs);
        });
    })();
</script>
</body>
</html>
