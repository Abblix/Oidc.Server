syntax = "proto3";

option csharp_namespace = "Abblix.Oidc.Server.Features.Storages.Proto";

import "google/protobuf/timestamp.proto";

// The moment before which every token issued to a principal is revoked, and before which
// an authentication session may not be reused.
//
// A message rather than a bare timestamp because the serializer dispatches on the stored
// type, and only types with a definition here avoid the JSON fallback and the warning it
// logs. A security control that warns on every ordinary use teaches operators to ignore the
// warning, which is the one thing a warning must not do.
//
// The encoding is part of the contract with whatever is already in the store. A record
// written in another format is not silently ignored - the parser refuses it and the request
// fails - so a store carrying cutoffs from a build that encoded them differently must be
// cleared before deploying this one, or those principals see errors until the records
// expire. Failing that way round is the right one: an unreadable revocation must not read
// as no revocation. A new revocation of such a principal fails the same way, since the
// record is read before it is replaced.
message RevocationCutoff {
  // The instant recorded by whoever performed the revocation.
  google.protobuf.Timestamp cutoff = 1;

  // When the record may be dropped, kept so that a later revocation naming an earlier or
  // the same cutoff can still keep the record longer without moving the cutoff back. A
  // record written before this field existed carries none, and is given the expiry of the
  // revocation that next reads it, which is never earlier than the one it was written with.
  google.protobuf.Timestamp expires_at = 2;
}
