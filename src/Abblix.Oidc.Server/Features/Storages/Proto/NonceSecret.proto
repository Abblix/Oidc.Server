syntax = "proto3";

option csharp_namespace = "Abblix.Oidc.Server.Features.Storages.Proto";

// The secret nonces of one rotation bucket are signed with.
//
// Kept through the entity storage rather than beside it, so a deployment serving several tenants keeps one
// secret per tenant and a nonce issued by one tenant does not validate at another.
message NonceSecret {
  // The HMAC-SHA256 key, generated at random the first time the bucket is asked for.
  bytes value = 1;
}
