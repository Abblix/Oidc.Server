sonar.projectKey=Abblix_Oidc.Server
sonar.organization=abblix

# Copy-paste detection exclusions.
# The MVC ClientRegistrationRequest DTO mirrors the framework-agnostic Model ClientRegistrationRequest
# property-for-property by design: the MVC layer binds the wire request, the core model is what the rest of the
# library consumes. Every property maps one distinct registration parameter, so the cross-file similarity is
# irreducible wire-DTO boilerplate, not refactorable logic - collapsing it would couple the MVC binding layer to
# the core model. Exclude both files from duplication detection so the metric reflects real logic duplication.
#
# The MinimalApi adapter generalizes the same by-design mirroring against the MVC adapter:
#   - the wire response DTOs (AuthorizationResponse, TokenResponse, DeviceAuthorizationResponse) are
#     framework-neutral and property-identical to the MVC ones, the same case as ClientRegistrationRequest above;
#   - the IResult formatters are the structural twins of the MVC IActionResult formatters - they cannot be merged
#     without coupling the two transport adapters, since each returns its host framework's result abstraction;
#   - the two incremental model generators already share their generation infrastructure through source-linked
#     files, leaving only the necessarily-similar generator entry points;
#   - each adapter's E2E TestHost Program bootstraps the same minimal host against its own adapter.
#
# NOTE: SonarCloud Automatic Analysis does NOT apply analysis-scope properties (cpd.exclusions, exclusions) from
# this file. The issue-ignore multicriteria below are NOT honored from the file either (confirmed 2026-07-15). The cpd pattern is mirrored in the
# project's Analysis Scope > Duplications settings in the SonarCloud UI, which is what actually takes effect under
# Automatic Analysis. This declaration is kept for discoverability and applies as-is if analysis ever moves to a
# CI-based scanner.
#
# IMPORTANT: this file and the SonarCloud UI do NOT sync automatically. When you add a pattern below, add the
# identical pattern in the UI (Analysis Scope > Duplications) too - a drift (this file updated, the UI left
# stale on a single pattern) silently re-counted the adapter mirror and failed PR #191's new-code duplication
# gate until the UI was resynced to the full list below.
sonar.cpd.exclusions=\
  **/Model/ClientRegistrationRequest.cs,\
  **/Model/AuthorizationResponse.cs,\
  **/Model/TokenResponse.cs,\
  **/Model/DeviceAuthorizationResponse.cs,\
  Abblix.Oidc.Server.MinimalApi/Formatters/*.cs,\
  **/*ModelGenerator.cs,\
  **/*E2E.TestHost/Program.cs,\
  **/*ErrorShapeTests.cs,\
  **/InteractionRedirectTests.cs,\
  **/SignedUserInfoTests.cs,\
  **/EndSessionTests.cs

# Per-rule, per-path exclusions. Each `eN` block is independent; ruleKey + resourceKey are globs
# evaluated together.
#
# CRITICAL: under SonarCloud Automatic Analysis these rules are NOT applied from this file - they must
# be mirrored in the SonarCloud UI (Analysis Scope > Ignore Issues on Multiple Criteria). Confirmed
# 2026-07-15: e1/e2 lived here but were absent from the UI, so 23 S1075 and 4 S1192 stood open on the
# board until the two rules were added in the UI. Kept here for discoverability and a future CI-based
# scanner. Keep this file and the UI in sync.

sonar.issue.ignore.multicriteria=e1,e2,e3

# S1075: hardcoded absolute URIs are test data inside *.UnitTests projects
# (URI builders, interop fixtures, DI HttpClient routing). The URIs ARE the
# subject under test - extracting them to constants would not improve clarity.
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.UnitTests/**/*

# S7764: the OIDC check_session_iframe (OpenID Connect Session Management 1.0)
# is browser-only and addresses window.parent / window.addEventListener for
# cross-frame postMessage. globalThis is equivalent in browsers but loses
# intent; the file already disables an analogous eslint rule.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e2.resourceKey=Abblix.Oidc.Server/Features/SessionManagement/Resources/checkSession.html

# S1192: duplicated string literals inside *.UnitTests projects are example URIs and token-type
# values (at+jwt, issuer.example.com/...) repeated across test cases; extracting them to constants
# would not improve the tests. Mirrored in the SonarCloud UI on 2026-07-15.
sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.UnitTests/**/*
