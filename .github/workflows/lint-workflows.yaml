name: Lint workflows

on:
  # Both jobs below are required status checks on the protected branches, so they must run on every
  # pull request targeting one. A path filter here made them required-but-absent for any PR outside
  # .github/, and a missing check can never be satisfied - the only way to merge was an admin bypass,
  # on every such PR. A required check has to be one CI can actually produce.
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  # A pull request's stale run is cancelled by its next push; a run on master or develop never is, since it
  # is the verdict on that commit and cancelling it would hide a red result behind the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-inline-secrets:
    name: Block expressions inside run scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

        timeout-minutes: 3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      # --only-binary :all: skips arbitrary setup-script execution at install
      # time (closes Sonar S8541). --require-hashes + pinned requirements file
      # locks both the resolved version and the artifact bytes - a malicious
      # PyPI release with the same version cannot pass the hash check (closes
      # Sonar S8544).
        timeout-minutes: 3
      - name: Install PyYAML
        run: |
          pip install --disable-pip-version-check --only-binary :all: \
            --require-hashes -r .github/workflows/requirements/lint-workflows.txt

        timeout-minutes: 3
      - name: Block expressions inside executed values
        # pinned commit (internal action, no semver tag) - one copy of the check for every repository;
        # it tests itself on planted expressions before reading this one
        uses: Abblix/.github/.github/actions/lint-workflow-expressions@9b0dd9cdb5a4a5b4c9f627c437d9f357146030a5

        timeout-minutes: 3
    timeout-minutes: 5
  actionlint:
    name: actionlint (schema + shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.10'
      # The checksum is mandatory: without it the step trusts whatever the network returns
      # and runs it with the job's permissions. When bumping the version, take the sum from
      # actionlint_<version>_checksums.txt of that same release.
      ACTIONLINT_SHA256: 'f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

        timeout-minutes: 3
      - name: Install actionlint
        run: |
          curl --proto '=https' -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

        timeout-minutes: 3
      - name: Run actionlint
        run: ./actionlint -color
        timeout-minutes: 3
    timeout-minutes: 5
