name: Publish dev build to GitHub Packages

# Triggered on every push to develop and to any release/* branch, so a release branch
# can be integration-tested against downstream consumers without cherry-picking its
# fixes back to develop first. MinVer (configured in Directory.Build.props) computes the
# package version from git tags + commit height; this workflow just packs and pushes the
# resulting .nupkg files to nuget.pkg.github.com/Abblix.
#
# Example version (with MinVerMinimumMajorMinor=2.3 and DefaultPreReleaseIdentifiers=dev.0):
#   pre-tag develop, 5 commits since v2.2  ->  2.3.0-dev.0.5
#   tagged v2.3.0-beta1                    ->  2.3.0-beta1
#   tagged v2.3.0                          ->  2.3.0
#
# Note: develop and release/* publish into the same 2.3.0-dev.* pre-release line, so a
# consumer floating 2.3.0-dev.* resolves the highest commit height across both branches.
# To gate deterministically against a specific branch build, pin the exact version.
#
# Releases (canonical 2.3.0, 2.3.0-beta1, etc.) flow through the manual
# enhanced-release.yml — this workflow does not produce them.

on:
  push:
    branches:
      - develop
      - 'release/**'
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - '**/*.sln'
      - 'NuGet.config'
      - '.github/workflows/publish-dev-builds.yml'

permissions:
  contents: read

concurrency:
  # Publishing mutates the package feed — never cancel a run mid-push, or the
  # feed is left with a partial package set; queue the newer commit's run
  # instead (--skip-duplicate keeps the re-push idempotent).
  group: publish-dev-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-and-publish:
    name: Pack and publish dev build
    runs-on: ubuntu-latest
    # Measured at 269s: build 100s, test 123s, restore 14s, pack 10s, push 6s. The previous ceiling
    # of 5 minutes was set from a measurement with no headroom, so the job silently outgrew it and
    # died at 5m06s and 5m16s, leaving the feed without those commits' packages. Worth knowing when
    # it happens again: a job timeout is reported as "cancelled" with the same wording as a manual
    # stop, so the only thing that identifies it is the duration landing exactly on the ceiling.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-telemetry: true

        timeout-minutes: 3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # MinVer needs the full commit history and tag refs to derive
          # the version. fetch-depth: 0 disables shallow clone.
          fetch-depth: 0
          persist-credentials: false

        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'

        timeout-minutes: 3
      - name: Restore
        run: dotnet restore

        timeout-minutes: 3
      - name: Build
        run: dotnet build --no-restore -c Release

        timeout-minutes: 3
      - name: Test
        # The whole suite in one pass over the tree this job just built. Sharding it the way
        # pr-tests does would be slower here, not faster: a shard restores and builds its own
        # dependency closure, where this reuses the build above. Measured at 202s for the slowest
        # shard against 123s for this step.
        #
        # The suite runs on this path because a squash merge produces a new commit on top of
        # wherever develop had moved to, so what lands on the branch is a state no pull request
        # tested, and no other workflow tests develop itself.
        run: dotnet test --no-build -c Release --verbosity normal

        timeout-minutes: 5
      - name: Pack
        # `pack --no-build` on the multi-targeted family csprojs trips NETSDK1085 on the .NET 10.0.301 SDK
        # ("NoBuild set but Build target invoked") — the outer no-build does not propagate to the inner
        # per-TFM pack. Drop --no-build; the earlier Build step left everything up to date, so pack's build
        # is an incremental no-op. GeneratePackageOnBuild=false stops the on-build pack double-running.
        run: dotnet pack --no-restore -c Release -o nupkg -p:GeneratePackageOnBuild=false

        timeout-minutes: 3
      - name: Push to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg") to nuget.pkg.github.com/Abblix..."
            dotnet nuget push "$pkg" \
              --api-key "$GH_TOKEN" \
              --source https://nuget.pkg.github.com/Abblix/index.json \
              --skip-duplicate
          done

        timeout-minutes: 3
      - name: Summary
        run: |
          set -euo pipefail
          # Pick any one package — they all share the same MinVer-derived version.
          PKG=$(find nupkg -maxdepth 1 -name 'Abblix.Oidc.Server.*.nupkg' | head -1 || true)
          if [ -n "$PKG" ]; then
            VERSION=$(basename "$PKG" .nupkg | sed 's|^Abblix.Oidc.Server.||')
            {
              echo "## Dev build published"
              echo ""
              echo "Version: \`$VERSION\` (derived by MinVer from git tags + height)"
              echo ""
              echo "Feed: https://github.com/Abblix/Oidc.Server/packages"
              echo ""
              echo "Consumers floating \`2.3.0-dev.*\` will pick this up on next \`dotnet restore\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        timeout-minutes: 3
