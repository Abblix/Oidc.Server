name: PR tests

on:
  pull_request:
    # The filter reads the BASE branch, so a release branch has to be named here or its pull
    # requests get no run at all - which renders as a short, green check list rather than as a
    # failure, because the checks with no base filter still post.
    branches: ["master", "develop", "release/**"]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which of the jobs below this pull request needs, so a change to prose runs no tests and a change
    # outside .github/ lints no workflows. On a pull request the checkout is GitHub's merge commit, whose first
    # parent is the base branch, so the diff against it is exactly what the pull request changes. An empty list
    # fails here rather than skipping every job, which would read as a green run that checked nothing.
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
        timeout-minutes: 3
      - name: Classify the changed files
        id: classify
        run: |
          set -euo pipefail
          files="$(git diff --name-only HEAD^1 HEAD)"
          if [ -z "$files" ]; then
            echo "::error::The pull request changes no file, so there is nothing to decide which checks it needs."
            exit 1
          fi
          code=false
          workflows=false
          while IFS= read -r file; do
            case "$file" in
              .github/*) workflows=true ;;
            esac
            # Written as what does NOT need the build and the tests, so a folder added later runs them
            case "$file" in
              *.md | docs/* | .github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          {
            echo "code=$code"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

  shards:
    # The shards themselves live in a called workflow, shared with the dev-build publish, so the
    # suite is defined once. The project list inside it is derived from the projects, not written
    # by hand, so a new test project cannot be left out.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-shards.yml

  build:
    # The whole SOLUTION in Release, which the shards do not cover: they build what the test
    # projects reach, and a project nothing references is compiled by nothing else a pull request
    # runs. Every shipped project is reachable today, so this job currently agrees with the shards
    # on every file - the difference is in what is MEASURED, and the day someone adds a project no
    # test names, only this job sees it.
    #
    # It used to justify itself differently, by the frameworks: the suite ran on one and the
    # packages shipped for three, so anything refused by an older compiler passed every shard and
    # surfaced after the merge. That reason went with the other two frameworks.
    name: Build the solution
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # harden-runner in audit mode: this may restore and build untrusted fork-PR code, so capture
      # baseline egress for later review.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # MinVer (referenced in Directory.Build.props) reads the latest tag plus commit height
          # from git to derive the version, so the shallow clone has to be disabled.
          fetch-depth: 0
          # No git push here, and this may run untrusted fork-PR code, so strip the GITHUB_TOKEN
          # from the runner git config after checkout.
          persist-credentials: false
        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          # No version here on purpose: with dotnet-version absent the action installs what
          # global.json names, which is the same file the local build resolves against. Naming a
          # version in each workflow is an enumeration - one of them is missed by a bump and that
          # job keeps building on the old SDK, green, until something needs the new one. The
          # version itself still moves by hand, but it moves in one place.
          #
          # That file also sets roll-forward to "disable", which is what makes "the same SDK" true
          # rather than nearly true. This action treats one literal value specially: on
          # "latestFeature" it drops the pinned build and installs the newest one on that channel,
          # which was a later prerelease of the same feature band. The difference surfaced as an
          # obsoletion reproducing only on the SDK the runner chose - red here, green wherever the
          # named version was the one installed, for a reason no diff contained. The tell is the
          # "--channel" argument in this step own log rather than a version comparison: the two
          # builds carry the same band, so comparing them says nothing happened.
          global-json-file: global.json
        timeout-minutes: 3
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/*.slnx', '**/Directory.Packages.props', '**/packages.lock.json', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-
        timeout-minutes: 3
      - name: Restore
        run: dotnet restore Abblix.Oidc.slnx
        timeout-minutes: 3
      - name: Build
        # Release, matching what the dev-build publish compiles: a configuration-conditional
        # analyser or a Release-only warning-as-error must fail here rather than after the merge.
        run: dotnet build Abblix.Oidc.slnx --no-restore -c Release
        timeout-minutes: 3

  test:
    # Single required status check aggregating the shards and the multi-framework build: it succeeds
    # only when both did. It stays a job of THIS workflow on purpose - a job inside a called workflow
    # is reported as "<caller job> / <job name>", which would rename the check that branch protection
    # requires and leave every pull request waiting for a check that no longer appears. The name is
    # narrower than what it now covers, and stays that way for the same reason: renaming it silently
    # detaches branch protection from the only gate a pull request has.
    #
    # A pull request that needs no tests passes it with the shards and the build skipped, and one that needs them
    # passes only when both succeeded.
    name: Unit tests
    needs: [changes, shards, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The gate only inspects the other jobs' results; it never touches the repo or the GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Fail if the changed files could not be classified
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Fail if any shard failed
        if: needs.changes.outputs.code == 'true' && needs.shards.result != 'success'
        run: exit 1
      - name: Fail if the multi-framework build failed
        if: needs.changes.outputs.code == 'true' && needs.build.result != 'success'
        run: exit 1

  no-inline-secrets:
    # Required on the protected branches: skipped through its condition it counts as passed, while a filter on the
    # event would leave the check expected and never reported
    name: Block inline untrusted-input interpolation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

        timeout-minutes: 3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      # --only-binary :all: skips arbitrary setup-script execution at install
      # time (closes Sonar S8541). --require-hashes + pinned requirements file
      # locks both the resolved version and the artifact bytes - a malicious
      # PyPI release with the same version cannot pass the hash check (closes
      # Sonar S8544).
        timeout-minutes: 3
      - name: Install PyYAML
        run: |
          pip install --disable-pip-version-check --only-binary :all: \
            --require-hashes -r .github/workflows/requirements/lint-workflows.txt

        timeout-minutes: 3
      - name: "Block inline untrusted-input interpolation in run: blocks"
        run: python .github/scripts/lint-no-inline-secrets.py

        timeout-minutes: 3
    timeout-minutes: 5
  actionlint:
    name: actionlint (schema + shellcheck)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.10'
      # The checksum is mandatory: without it the step trusts whatever the network returns
      # and runs it with the job's permissions. When bumping the version, take the sum from
      # actionlint_<version>_checksums.txt of that same release.
      ACTIONLINT_SHA256: 'f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

        timeout-minutes: 3
      - name: Install actionlint
        run: |
          curl --proto '=https' -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

        timeout-minutes: 3
      - name: Run actionlint
        run: ./actionlint -color
        timeout-minutes: 3
    timeout-minutes: 5
