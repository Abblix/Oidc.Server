name: CodeQL

# Restricted-trigger custom workflow (Рычаг 2). Default Setup is
# intentionally left `not-configured` because it cannot disable the
# weekly schedule or PR triggers via API; only a custom workflow gives
# full control. See .github/codeql/README.md for the policy and the
# May 2026 incident that led to the restrictions.
#
# Analysis runs buildless (build-mode: none). Autobuild used to compile the
# multi-target (net8/9/10) solution, which exceeded the 5-minute step cap and
# left every run with nothing extracted - a green job that analysed no code.
# The C# extractor reads the sources directly, so the compile is not needed
# at all and the run finishes in a couple of minutes.
on:
  workflow_dispatch:
  push:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    # 10m total cap. Higher than the 5m baseline because CodeQL still has to
    # extract every source file and run the full query suite, but well below
    # the old 15m, which existed only to leave room for the compile.
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 3
        with:
          persist-credentials: false

      # No SDK setup and no autobuild step: build-mode none never invokes a
      # compiler, so neither would contribute anything but wall-clock.
      - uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        timeout-minutes: 3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        timeout-minutes: 6
