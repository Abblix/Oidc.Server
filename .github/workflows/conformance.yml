name: OIDF conformance

# Runs the OpenID Foundation conformance plans the library is certified against, and the FAPI 2.0, FAPI 1.0 Advanced
# and FAPI-CIBA plans, on the suite's newest numbered release, against the conformance test host on each transport
# adapter, Minimal API and MVC; all four runs gate a release alike: the release workflow (release.yml) calls
# it as its conformance job, which its create-release job needs before it creates the GitHub release and the packages
# are published, and for a pre-release before the tag is created. The four run at once, each on a runner of its own.
# A stable release's signed tag is pushed by hand before the workflow starts, so a failed run leaves that
# tag in place. A pull request touching the run itself runs it too, and it can be started by hand.
on:
  pull_request:
    branches: [develop, 'release/**']
    paths:
      - 'conformance/**'
      - 'tests/Abblix.Oidc.Server.Conformance.TestHost/**'
      - 'tests/Abblix.Oidc.Server.MinimalApi.Conformance.TestHost/**'
      - 'tests/Abblix.Oidc.Server.Mvc.Conformance.TestHost/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from the release workflow, github.workflow and github.event_name are the caller's: the group is
  # "Release-conformance-<ref>", never the release's own "release", and a workflow_dispatch event
  # cancels nothing, so a release's run is never cancelled; only a pull request's superseded run is
  group: ${{ github.workflow }}-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oidf:
    name: OIDF certified plans on ${{ matrix.adapter }}
    # A failure on one adapter leaves the other's run going, so its verdict and evidence are not lost with it
    strategy:
      fail-fast: false
      matrix:
        adapter: [MinimalApi, Mvc]
    # GitHub-hosted for every trigger, an exception to the self-hosted rule: the run starts the suite, its database,
    # the host and the browser as containers on one network, which needs a Docker daemon, and the shared runners carry
    # none by design. The job holds no secret, and a pull request from a fork runs on a runner thrown away afterwards
    runs-on: ubuntu-latest
    # Run 43821147250 took 15m57s for this job on Minimal API, +20% (Kirill); the MVC run has the same ceiling, copied
    # from Minimal API pending its own first hosted run. It is below the sum of its steps' ceilings: the plans step
    # stopping at its own still leaves about a minute for collecting and uploading the evidence, which take seconds
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # MinVer reads the latest tag and the commit height, so the host's build needs the full history
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
        timeout-minutes: 3

      - name: Run the certified plans
        shell: pwsh
        env:
          ADAPTER: ${{ matrix.adapter }}
          RESULTS: ${{ runner.temp }}/conformance-results
        run: ./conformance/run.ps1 -Adapter $env:ADAPTER -ResultsPath $env:RESULTS
        # Run 43821147250 took 15m35s for this step on Minimal API, +20% (Kirill); copied for MVC as the job's ceiling is
        timeout-minutes: 19

      # A step stopped at its ceiling may not finish its finally block, so the containers may still be there holding
      # the logs; what the script already saved is kept
      - name: Collect what a stopped run left
        if: failure()
        shell: pwsh
        env:
          RESULTS: ${{ runner.temp }}/conformance-results
        run: |
          New-Item -ItemType Directory -Force $env:RESULTS | Out-Null
          foreach ($container in 'oidc-host', 'oidf-browser') {
            $log = Join-Path $env:RESULTS "$container.log"
            if ((docker ps -aq --filter "name=^$container$") -and -not (Test-Path -LiteralPath $log)) {
              docker logs $container *> $log
            }
          }
          $screenshots = Join-Path $env:RESULTS 'screenshots'
          if ((docker ps -aq --filter 'name=^oidf-browser$') -and -not (Test-Path -LiteralPath $screenshots)) {
            docker cp 'oidf-browser:/tmp/screenshots' $screenshots
          }
        timeout-minutes: 3

      # Kept for a passing run too, since its review screenshots are what a person looks at; a day is enough, as they
      # are looked at straight away or not at all
      - name: Upload the evidence of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-${{ matrix.adapter }}
          path: ${{ runner.temp }}/conformance-results
          retention-days: 1
          if-no-files-found: warn
        timeout-minutes: 3

  fapi:
    name: OIDF FAPI and FAPI-CIBA plans on ${{ matrix.adapter }}
    strategy:
      fail-fast: false
      matrix:
        adapter: [MinimalApi, Mvc]
    # GitHub-hosted for the reason the certified plans' job gives; every job and every adapter on a runner of its own,
    # so the fixed container names and compose project run.ps1 uses never meet another run's
    runs-on: ubuntu-latest
    # Run 43821147250 took 10m15s for this job on Minimal API, +20% (Kirill); the MVC run has the same ceiling, copied
    # from Minimal API pending its own first hosted run. It is below the sum of its steps' ceilings: the plans step
    # stopping at its own still leaves about a minute for collecting and uploading the evidence, which take seconds
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # MinVer reads the latest tag and the commit height, so the host's build needs the full history
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
        timeout-minutes: 3

      - name: Run the FAPI and FAPI-CIBA plans
        shell: pwsh
        env:
          ADAPTER: ${{ matrix.adapter }}
          RESULTS: ${{ runner.temp }}/conformance-fapi-results
        run: ./conformance/run.ps1 -Adapter $env:ADAPTER -PlanFile ./conformance/fapi-plans.txt -ResultsPath $env:RESULTS
        # Run 43821147250 took 9m52s for this step on Minimal API, +20% (Kirill); copied for MVC as the job's ceiling is
        timeout-minutes: 12

      # A step stopped at its ceiling may not finish its finally block, so the containers may still be there holding
      # the logs; what the script already saved is kept
      - name: Collect what a stopped run left
        if: failure()
        shell: pwsh
        env:
          RESULTS: ${{ runner.temp }}/conformance-fapi-results
        run: |
          New-Item -ItemType Directory -Force $env:RESULTS | Out-Null
          foreach ($container in 'oidc-host', 'oidf-browser') {
            $log = Join-Path $env:RESULTS "$container.log"
            if ((docker ps -aq --filter "name=^$container$") -and -not (Test-Path -LiteralPath $log)) {
              docker logs $container *> $log
            }
          }
          $screenshots = Join-Path $env:RESULTS 'screenshots'
          if ((docker ps -aq --filter 'name=^oidf-browser$') -and -not (Test-Path -LiteralPath $screenshots)) {
            docker cp 'oidf-browser:/tmp/screenshots' $screenshots
          }
        timeout-minutes: 3

      # Kept for a passing run too, since its review screenshots are what a person looks at; a day is enough, as they
      # are looked at straight away or not at all
      - name: Upload the evidence of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-fapi-results-${{ matrix.adapter }}
          path: ${{ runner.temp }}/conformance-fapi-results
          retention-days: 1
          if-no-files-found: warn
        timeout-minutes: 3
