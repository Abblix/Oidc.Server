name: Enhanced Release Automation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.4 or 2.4.0-beta3)'
        required: true
        type: string
      pre_release:
        description: 'Create pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  # Release/publish workflow: never cancel an in-flight run. A second dispatch
  # must not kill a publish mid-flight (half-pushed packages, a dangling tag).
  # This deliberately overrides the org-wide "cancel-in-progress: true" default,
  # which exists for runaway analyzer/PR queues, not for state-mutating releases.
  cancel-in-progress: false

jobs:
  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      version_full: ${{ steps.set_version.outputs.version_full }}
      previous_version: ${{ steps.set_version.outputs.previous_version }}
    steps:
      # harden-runner in audit mode: capture baseline egress without blocking.
      # Promote to egress-policy: block + disable-sudo: true once the allowlist
      # is known (per the GHA security checklist rollout guidance).
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - name: Resolve version
        id: set_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Error: invalid version format: $INPUT_VERSION"
            exit 1
          fi
          VERSION="$INPUT_VERSION"
          echo "Using explicit version: $VERSION"

          # MinVer 7.x rejects a two-part --version-override (MINVER1005), so expand the X.Y
          # release input to a full X.Y.0 SemVer for the build and pack override only. The tag and
          # the GitHub Release keep the X.Y form, deliberately: NuGet normalizes X.Y to X.Y.0, so
          # the published package version is identical, and the short name is what the releases,
          # their links and the notes files have always used.
          #
          # The cost is stated rather than discovered: MinVer parses a TAG as SemVer, and "2.3" is
          # not one, so it reads none of this repository's release tags. Nothing depends on it
          # reading them - the release version comes from this input and dev versions from
          # MinVerMinimumMajorMinor - but it does mean the height in a dev version counts from the
          # root commit rather than from the last release, and that a tag is not what any number
          # here is derived from. A -prerelease suffix is preserved as given.
          CORE="${VERSION%%-*}"
          PRERELEASE=""
          [ "$VERSION" != "$CORE" ] && PRERELEASE="-${VERSION#*-}"
          if [[ "$CORE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION_FULL="${CORE}.0${PRERELEASE}"
          else
            VERSION_FULL="$VERSION"
          fi
          echo "MinVer override version: $VERSION_FULL"

          # The release's own tag is on HEAD by now, so it is excluded - otherwise the release
          # is reported as its own predecessor and the fallback changelog spans nothing.
          PREVIOUS_VERSION=$(git describe --tags --abbrev=0 --exclude "v$VERSION" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_VERSION" ]; then
            PREVIOUS_VERSION=${PREVIOUS_VERSION#v}
            echo "Previous version: $PREVIOUS_VERSION"
          fi

          {
            echo "version=$VERSION"
            echo "version_full=$VERSION_FULL"
            echo "previous_version=$PREVIOUS_VERSION"
          } >> "$GITHUB_OUTPUT"

        timeout-minutes: 3
    timeout-minutes: 5
  # The same shards every pull request runs, one job per test project, so the release meets the
  # suite on the rig that already proved this commit rather than on a single job with a wall of
  # its own. The shards build each project from the same commit; what they prove is the source,
  # and the packed binaries below are built from it once more under the release version.
  tests:
    needs: versioning
    uses: ./.github/workflows/test-shards.yml

  build-and-pack:
    needs: [versioning, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build-provenance attestation signs the produced packages through the
      # Sigstore OIDC flow and records the attestation in the repo (SLSA L3).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
      VERSION_FULL: ${{ needs.versioning.outputs.version_full }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3
      - name: Log build context
        run: |
          echo "Commit:  $(git rev-parse HEAD)"
          echo "Ref:     $GITHUB_REF"
          echo "Version: $VERSION"
        timeout-minutes: 3
      - name: Restore dependencies
        run: dotnet restore
      # MinVerVersionOverride forces MinVer to use the workflow-supplied
      # version verbatim, bypassing the tag/height computation. The
      # subsequent create-release job then tags this exact version, so
      # the produced .nupkg files and the resulting GitHub Release stay
      # in lock-step.
        timeout-minutes: 3
      - name: Build
        run: dotnet build --no-restore -c Release -p:MinVerVersionOverride="$VERSION_FULL"
        # Above the step baseline: the whole solution builds here in one job, and the baseline is
        # what killed a release build that needed most of it.
        timeout-minutes: 10
      - name: Pack
        run: dotnet pack --no-build -c Release -o nupkg -p:MinVerVersionOverride="$VERSION_FULL"
        timeout-minutes: 3
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'nupkg/*.nupkg'
        timeout-minutes: 3
      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg

        timeout-minutes: 3
    timeout-minutes: 5
  test-getting-started:
    needs: [versioning, build-and-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - name: Checkout main repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: main-repo
          persist-credentials: false
        timeout-minutes: 3
      - name: Checkout GettingStarted repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Abblix/Oidc.Server.GettingStarted
          path: getting-started
          persist-credentials: false
        timeout-minutes: 3
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: local-packages
        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3
      - name: Setup local package source
        run: |
          dotnet nuget add source "$(pwd)/local-packages" --name "LocalAbblix"
          dotnet nuget locals all --clear
        timeout-minutes: 3
      - name: Update package references
        run: |
          cd getting-started
          sed -i "s|<PackageReference Include=\"Abblix.Oidc.Server.Mvc\" Version=\"[^\"]*\"|<PackageReference Include=\"Abblix.Oidc.Server.Mvc\" Version=\"$VERSION\"|g" OpenIDProviderApp/OpenIDProviderApp.csproj
        timeout-minutes: 3
      - name: Test GettingStarted builds
        run: |
          cd getting-started
          dotnet restore
          dotnet build
        timeout-minutes: 3
      - name: Test OpenIDProviderApp runs
        run: |
          cd getting-started/OpenIDProviderApp
          dotnet run &
          APP_PID=$!
          for _ in {1..30}; do
            if curl -fsS http://localhost:5000 >/dev/null 2>&1 \
               || curl -fsS http://localhost:5000/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "App is responding"
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "App process died before responding"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true

        timeout-minutes: 3
    timeout-minutes: 5
  create-release:
    needs: [versioning, build-and-pack, test-getting-started]
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.versioning.outputs.previous_version }}
    outputs:
      is_prerelease: ${{ steps.validate_inputs.outputs.is_prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - name: Validate and normalize inputs
        id: validate_inputs
        env:
          INPUT_PRE_RELEASE: ${{ github.event.inputs.pre_release }}
        run: |
          if [ "$INPUT_PRE_RELEASE" = "true" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        timeout-minutes: 3
      # This job pushes a tag on the pre-release path, so the checkout keeps its
      # git credentials (no persist-credentials: false). Stable releases must
      # already carry a human-created signed tag - see "Create or verify tag".
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
        timeout-minutes: 3
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkg
        timeout-minutes: 3
      - name: Create or verify tag
        env:
          INPUT_PRE_RELEASE: ${{ github.event.inputs.pre_release }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            if [ "$(git cat-file -t "v$VERSION")" = "tag" ]; then
              echo "Tag v$VERSION exists and is annotated - using it"
            else
              echo "Error: tag v$VERSION is lightweight (not annotated/signed)."
              echo "Stable releases require an annotated, GPG-signed tag carrying the release notes."
              echo "Recreate it: git tag -a v$VERSION -F RELEASE_NOTES_v$VERSION.md -s && git push origin v$VERSION"
              exit 1
            fi
          else
            if [ "$INPUT_PRE_RELEASE" != "true" ]; then
              echo "Error: no tag v$VERSION found."
              echo "A stable release must be tagged (annotated + GPG-signed) before this workflow runs."
              echo "Create it on the release branch: git tag -a v$VERSION -F RELEASE_NOTES_v$VERSION.md -s && git push origin v$VERSION"
              exit 1
            fi
            echo "Pre-release: creating annotated tag v$VERSION"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "v$VERSION" -m "Pre-release v$VERSION"
            git push origin "v$VERSION"
          fi
        timeout-minutes: 3
      - name: Generate changelog
        id: changelog
        run: |
          if [ "$(git cat-file -t "v$VERSION" 2>/dev/null)" = "tag" ]; then
            echo "Using annotated tag message as release notes"
            # %(contents) includes the GPG/SSH signature block; strip it so the
            # release body is only the notes. The tag must be created with
            # --cleanup=verbatim so Markdown "##" headers in the notes survive.
            git tag -l --format='%(contents)' "v$VERSION" | sed '/-----BEGIN .* SIGNATURE-----/,$d' > CHANGELOG.md
          elif [ -n "$PREVIOUS_VERSION" ]; then
            echo "## Changes since v$PREVIOUS_VERSION" > CHANGELOG.md
            echo "" >> CHANGELOG.md

            PREV_TAG="v$PREVIOUS_VERSION"
            CURR_TAG="v$VERSION"

            if git rev-parse "$PREV_TAG" >/dev/null 2>&1 && git rev-parse "$CURR_TAG" >/dev/null 2>&1; then
              git log --oneline "$PREV_TAG..$CURR_TAG" --pretty=format:"- %s" >> CHANGELOG.md \
                || echo "- Various improvements and fixes" >> CHANGELOG.md
            else
              echo "- Various improvements and fixes" >> CHANGELOG.md
            fi
          else
            echo "## Initial Release" > CHANGELOG.md
          fi

          {
            echo ""
            echo "## NuGet Packages"
            for pkg in nupkg/*.nupkg; do
              basename=$(basename "$pkg" .nupkg)
              echo "- $basename"
            done

            echo ""
            echo "Available on:"
            echo "- [NuGet.org](https://www.nuget.org/packages?q=Abblix)"
            echo "- [GitHub Packages](https://github.com/Abblix/Oidc.Server/packages)"
          } >> CHANGELOG.md
        timeout-minutes: 3
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.versioning.outputs.version }}
          name: v${{ needs.versioning.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          prerelease: ${{ steps.validate_inputs.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.validate_inputs.outputs.is_prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        timeout-minutes: 3
    timeout-minutes: 5
  publish-github-packages:
    needs: [versioning, build-and-pack, test-getting-started, create-release]
    runs-on: ubuntu-latest
    # Same approval gate as NuGet.org: no package leaves the build for any
    # registry without passing the publish-packages environment reviewers.
    environment: publish-packages
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkg
        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3
      - name: List packages to be published
        run: |
          echo "Packages ready for publishing to GitHub Packages:"
          for pkg in nupkg/*.nupkg; do
            echo "  - $(basename "$pkg")"
          done
          echo "Publishing destination: https://nuget.pkg.github.com/Abblix/index.json"
        timeout-minutes: 3
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg") to GitHub Packages..."
            dotnet nuget push "$pkg" \
              --api-key "$GITHUB_TOKEN" \
              --source https://nuget.pkg.github.com/Abblix/index.json \
              --skip-duplicate
          done
          echo "GitHub Packages publishing completed"
        timeout-minutes: 3
      - name: Verify publication
        run: |
          echo "Verification: https://github.com/Abblix/Oidc.Server/packages"
          echo "Published packages (sha256):"
          sha256sum nupkg/*.nupkg
        timeout-minutes: 3
    timeout-minutes: 5
  publish-nuget-org:
    needs: [versioning, build-and-pack, test-getting-started, create-release]
    runs-on: ubuntu-latest
    environment: publish-packages
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkg
        timeout-minutes: 3
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3
      - name: List packages to be published
        run: |
          echo "Packages ready for publishing to NuGet.org:"
          for pkg in nupkg/*.nupkg; do
            echo "  - $(basename "$pkg")"
          done
          echo "Publishing destination: https://api.nuget.org/v3/index.json"
          echo "This step requires manual approval in GitHub Actions."
        timeout-minutes: 3
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg") to NuGet.org..."
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          echo "NuGet.org publishing completed"
        timeout-minutes: 3
      - name: Verify publication
        run: |
          echo "Verification: https://www.nuget.org/packages?q=Abblix"
          echo "Wait 5-15 minutes for package indexing to complete"
          echo "Published packages (sha256):"
          sha256sum nupkg/*.nupkg
        timeout-minutes: 3
    timeout-minutes: 5
  update-getting-started:
    needs: [versioning, create-release, publish-nuget-org]
    runs-on: ubuntu-latest
    environment: update-sample
    permissions:
      contents: read
    if: ${{ needs.create-release.outputs.is_prerelease == 'false' }}
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
        timeout-minutes: 3
      # Read-only checkout to edit the csproj locally; the signed commit is made
      # through the Contents API (next step), so nothing is git-pushed here and
      # the token must not be persisted as a git credential.
      - name: Checkout GettingStarted repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Abblix/Oidc.Server.GettingStarted
          token: ${{ secrets.GETTING_STARTED_REPO_TOKEN }}
          persist-credentials: false
        timeout-minutes: 3
      - name: Update package references to released version
        run: |
          sed -i "s|<PackageReference Include=\"Abblix.Oidc.Server.Mvc\" Version=\"[^\"]*\"|<PackageReference Include=\"Abblix.Oidc.Server.Mvc\" Version=\"$VERSION\"|g" OpenIDProviderApp/OpenIDProviderApp.csproj
        timeout-minutes: 3
      - name: Open a pull request with a signed commit
        env:
          GH_TOKEN: ${{ secrets.GETTING_STARTED_REPO_TOKEN }}
        run: |
          REPO="Abblix/Oidc.Server.GettingStarted"
          FILE="OpenIDProviderApp/OpenIDProviderApp.csproj"
          BRANCH="chore/bump-abblix-v$VERSION"
          # Nothing to do if the version already matches.
          if git diff --quiet -- "$FILE"; then
            echo "No version change needed; skipping PR."
            exit 0
          fi
          # The master branch ruleset requires signed commits AND a pull request,
          # so a plain git push is rejected (GH013). Commit the bumped file
          # through the Contents API instead: GitHub signs API commits (satisfies
          # required_signatures) and the PR satisfies the pull_request rule. A
          # code owner still reviews and merges (1 approval required).
          # Existence is checked explicitly so real errors fail the job loudly
          # instead of being masked by "|| echo".
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; reusing it."
          else
            BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$BASE_SHA"
          fi
          FILE_SHA=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha')
          CONTENT=$(base64 -w0 "$FILE")
          gh api -X PUT "repos/$REPO/contents/$FILE" \
            -f "message=Update Abblix packages to v$VERSION" \
            -f "content=$CONTENT" \
            -f "sha=$FILE_SHA" \
            -f "branch=$BRANCH"
          if [ "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "A pull request for $BRANCH is already open."
          else
            gh pr create --repo "$REPO" --base master --head "$BRANCH" \
              --title "Update Abblix packages to v$VERSION" \
              --body "Automated bump of Abblix.Oidc.Server.Mvc to v$VERSION after the release. Requires code-owner review per branch protection."
          fi
        timeout-minutes: 3
    timeout-minutes: 5
